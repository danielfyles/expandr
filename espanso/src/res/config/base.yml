# Expandr match file — your snippets live here.
#
# Each entry below is a snippet: type the "trigger" anywhere and it is replaced
# with the "replace" text. This starter set shows what Expandr can do — edit it,
# delete it, or add your own, in the Expandr app or right here.
# (Mind the indentation: this is YAML.)

matches:
  # 1. A plain replacement — type :expandr to check everything is working.
  - trigger: ":expandr"
    replace: "Hi there! Expandr is working."

  # 2. Multi-line text — the classic email sign-off. Edit it to be yours.
  - trigger: ":sig"
    replace: |-
      Best regards,
      Your Name

  # 3. Today's date, via a variable. The format uses strftime codes
  #    (%d day, %B month name, %Y year) — see www.strfti.me for the full list.
  - trigger: ":date"
    replace: "{{today}}"
    vars:
      - name: today
        type: date
        params:
          format: "%d %B %Y"

  # 4. Whatever is on your clipboard. Wrap it in anything you like — for example
  #    "[{{clipboard}}]({{clipboard}})" turns a copied URL into a Markdown link.
  - trigger: ":clip"
    replace: "{{clipboard}}"
    vars:
      - name: clipboard
        type: clipboard

  # 5. The output of a shell command.
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # 6. Rich text — a heading, a list, some bold and italics. Rich snippets are
  #    stored as Markdown and pasted as formatted text; edit them visually in the
  #    Expandr app by switching the Replacement to "Rich text".
  - trigger: ":agenda"
    markdown: |-
      ## Agenda

      - **Updates** from everyone
      - Blockers and decisions
      - _Next steps_ and owners
