# Expandr configuration file
#
# Global options for the Expandr engine. These apply in every application (they
# can also be overridden per app). The commonly tuned ones are listed below,
# commented out — uncomment and change any you need.
# For the full list of options, see the Expandr README: github.com/danielfyles/expandr

# --- Toggle key
# The key that pauses/resumes Expandr when double-tapped.
# Options: CTRL, SHIFT, ALT, CMD, OFF (or one side, e.g. LEFT_CTRL, RIGHT_SHIFT)
# toggle_key: ALT
# toggle_key: OFF   # disable the toggle key entirely

# --- Injection backend
# How Expandr types the text. "Auto" works for most apps; try "Clipboard" or
# "Inject" if a particular app misbehaves.
# backend: Clipboard

# --- Auto-restart
# Reload automatically when a config or snippet file changes.
# auto_restart: false

# --- Clipboard threshold
# Typing long text character-by-character is slow, so replacements longer than
# this many characters are pasted via the clipboard instead.
# clipboard_threshold: 100

# --- Regex buffer size
# Max characters kept in memory for regex triggers (i.e. the longest regex
# trigger you can match). Keep it small; raise it only for very long triggers.
# max_regex_buffer_size: 30
